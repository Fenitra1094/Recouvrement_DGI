# ==========================================================
# Application DGI - Recouvrement (HETRA-RINDRA / SIG-SSIF)
# Profil par défaut : poste de développement local
# ==========================================================

# --- Serveur ---
# 8085 pour éviter le conflit avec le port 8080 déjà occupé en local
server.port=8085

# --- Connexion PostgreSQL (container Docker ssif-db, publié sur 5433
# car un PostgreSQL local occupe déjà le 5432 sur cette machine) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/recouvrement_db
spring.datasource.username=dgi_user
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Les tables sont créées/mises à jour automatiquement à partir des @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Initialisation automatique des données de référence ---
# Exécute data.sql au démarrage (les tables existent déjà grâce à ddl-auto)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# --- JWT ---
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
app.jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174

# --- Logging ---
logging.level.org.hibernate.SQL=INFO

# --- Relance automatique et pénalités ---
# Les paramètres sont dans config/relance.properties et config/penalites.properties,
# en dehors du code : ./config dans le conteneur Docker, ../config en lancement depuis l'IDE
spring.config.import=optional:file:./config/relance.properties,optional:file:../config/relance.properties,\
  optional:file:./config/penalites.properties,optional:file:../config/penalites.properties

# --- Email (SMTP Gmail) ---
# Identifiants lus depuis les variables d'environnement (fichier .env), jamais écrits ici
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
