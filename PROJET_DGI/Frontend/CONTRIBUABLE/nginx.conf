server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels d'API transmis au backend (conteneur "backend" du réseau Docker) :
    # le navigateur appelle la même adresse que la page (/api), qu'il soit sur ce PC,
    # sur un téléphone du même Wi-Fi ou derrière un tunnel. Plus de "localhost:8085" côté navigateur.
    location /api/ {
        proxy_pass http://backend:8085/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
