<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Fond Ciel Doux -->
  <rect width="800" height="600" fill="#d9e6f5" />
  
  <!-- Ombre Sol Base -->
  <rect x="0" y="480" width="800" height="120" fill="#b0c4de" opacity="0.5" />
  <rect x="80" y="430" width="640" height="70" fill="#9bb3d1" opacity="0.6" />

  <!-- SOCLE DU BÂTIMENT -->
  <rect x="120" y="420" width="560" height="20" fill="#2b507d" />
  <rect x="100" y="440" width="600" height="15" fill="#1e3a61" />

  <!-- CORPS PRINCIPAL (Ailes Gauche et Droite) -->
  <rect x="130" y="260" width="540" height="160" fill="#5882b5" />
  
  <!-- FENÊTRES AILE GAUCHE -->
  <rect x="150" y="280" width="30" height="45" rx="3" fill="#1b3860" />
  <rect x="195" y="280" width="30" height="45" rx="3" fill="#1b3860" />
  <rect x="240" y="280" width="30" height="45" rx="3" fill="#1b3860" />
  
  <rect x="150" y="350" width="30" height="50" rx="3" fill="#1b3860" />
  <rect x="195" y="350" width="30" height="50" rx="3" fill="#1b3860" />
  <rect x="240" y="350" width="30" height="50" rx="3" fill="#1b3860" />

  <!-- FENÊTRES AILE DROITE -->
  <rect x="530" y="280" width="30" height="45" rx="3" fill="#1b3860" />
  <rect x="575" y="280" width="30" height="45" rx="3" fill="#1b3860" />
  <rect x="620" y="280" width="30" height="45" rx="3" fill="#1b3860" />
  
  <rect x="530" y="350" width="30" height="50" rx="3" fill="#1b3860" />
  <rect x="575" y="350" width="30" height="50" rx="3" fill="#1b3860" />
  <rect x="620" y="350" width="30" height="50" rx="3" fill="#1b3860" />

  <!-- BLOC CENTRAL DGI -->
  <rect x="290" y="200" width="220" height="220" fill="#eaf2ff" />
  <rect x="300" y="210" width="200" height="210" fill="#ffffff" />

  <!-- PILIERS CENTRAUX -->
  <rect x="320" y="250" width="25" height="170" fill="#a4c2e6" />
  <rect x="365" y="250" width="25" height="170" fill="#a4c2e6" />
  <rect x="410" y="250" width="25" height="170" fill="#a4c2e6" />
  <rect x="455" y="250" width="25" height="170" fill="#a4c2e6" />

  <!-- PORTE D'ENTRÉE PRINCIPALE -->
  <rect x="375" y="340" width="50" height="80" rx="4" fill="#1e3a61" />

  <!-- FRONTON TRIANGULAIRE CENTRAL -->
  <polygon points="280,200 400,120 520,200" fill="#8daed6" />
  <polygon points="295,195 400,130 505,195" fill="#c3d8f3" />

  <!-- CERCLE SYMBOLE DGI AU CENTRE -->
  <circle cx="400" cy="170" r="16" fill="#ffffff" />

  <!-- MÂT DE DRAPEAU -->
  <line x1="400" y1="120" x2="400" y2="40" stroke="#4a5568" stroke-width="4" stroke-linecap="round" />
  <circle cx="400" cy="38" r="4" fill="#cbd5e0" />

  <!-- DRAPEAU DE MADAGASCAR (Officiel : Blanc à gauche, Rouge en haut à droite, Vert en bas à droite) -->
  <g transform="translate(402, 42)">
    <!-- Bande Blanche (Gauche) -->
    <rect x="0" y="0" width="22" height="36" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.5" />
    <!-- Bande Rouge (Haut Droite) -->
    <rect x="22" y="0" width="44" height="18" fill="#fc3d32" />
    <!-- Bande Verte (Bas Droite) -->
    <rect x="22" y="18" width="44" height="18" fill="#007e3a" />
  </g>
</svg>