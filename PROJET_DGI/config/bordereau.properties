# ==========================================================
# HETRA-RINDRA - Bordereaux de versement
# ----------------------------------------------------------
# Après une modification : docker restart ssif-backend
#
# Attention : pas de commentaire à la fin d'une ligne de valeur,
# un commentaire doit toujours être sur sa propre ligne.
# ==========================================================

# Durée de validité d'un bordereau, en jours.
# Le bordereau expire plus tôt si la pénalité augmente avant la fin de ce délai :
# il est valable au plus tard jusqu'à la veille de la hausse, pour que son montant reste toujours juste.
# Un bordereau expiré est annulé et remplacé par un nouveau au montant du jour.
bordereau.validite-jours=30
