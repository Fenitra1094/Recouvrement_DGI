# ==========================================================
# HETRA-RINDRA - Calcul automatique des impôts
# ----------------------------------------------------------
# Le contribuable (ou l'agent au guichet) saisit la base,
# le système calcule l'impôt avec les taux ci-dessous.
# Après une modification : docker restart ssif-backend
# (pas besoin de recompiler ni de toucher à la base)
#
# Attention : pas de commentaire à la fin d'une ligne de valeur,
# un commentaire doit toujours être sur sa propre ligne.
# Taux : 0.20 = 20 %
# ==========================================================

# ---------- Régime fiscal (fixé à l'inscription) ----------
# CA > seuil                    -> IR + TVA
# CA <= seuil, option IR        -> IR + TVA
# CA <= seuil, sans option      -> IS (Impôt Synthétique)
# L'IRSA n'est pas un régime : impôt de l'employeur, donné par l'assujettissement
# Seuil en Ariary (chiffre d'affaires annuel)
impot.seuil-chiffre-affaires=400000000

# ---------- IS : Impôt Synthétique ----------
# Base : chiffre d'affaires annuel
impot.taux-is=0.05

# ---------- IR : Impôt sur les Revenus ----------
# Base : revenu net imposable annuel
impot.taux-ir=0.20

# ---------- TVA ----------
# TVA à payer = chiffre d'affaires HT du mois x taux - TVA déductible du mois
# Si le résultat est négatif (crédit de TVA), rien n'est à payer
impot.taux-tva=0.20

# ---------- IRSA : barème progressif par tranches ----------
# Base : salaire imposable du mois
# Chaque tranche s'applique à la partie du salaire au-dessus de "debut"
# et jusqu'au début de la tranche suivante.
impot.tranches-irsa[0].debut=0
impot.tranches-irsa[0].taux=0
impot.tranches-irsa[1].debut=350000
impot.tranches-irsa[1].taux=0.05
impot.tranches-irsa[2].debut=400000
impot.tranches-irsa[2].taux=0.10
impot.tranches-irsa[3].debut=500000
impot.tranches-irsa[3].taux=0.15
impot.tranches-irsa[4].debut=600000
impot.tranches-irsa[4].taux=0.20

# Montant minimum d'IRSA quand l'impôt calculé est positif mais plus petit (en Ariary)
impot.minimum-irsa=3000

# ---------- Dates limites de paiement ----------
# Elles ne sont plus ici : colonnes echeance_jour, echeance_decalage_mois, echeance_mois
# de la table types_impots (une date limite par impôt).
