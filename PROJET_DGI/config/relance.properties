# ==========================================================
# HETRA-RINDRA - Paramètres de la relance automatique
# ----------------------------------------------------------
# Ce fichier est lu au démarrage du backend.
# Après une modification : docker restart ssif-backend
# (pas besoin de recompiler ni de toucher à la base)
#
# Attention : pas de commentaire à la fin d'une ligne de valeur,
# un commentaire doit toujours être sur sa propre ligne.
# ==========================================================

# Active ou désactive la relance planifiée (true / false).
# Le bouton "Lancer maintenant" côté DGI reste utilisable même à false.
relance.active=true

# ----------------------------------------------------------
# QUAND ? (expression cron : seconde minute heure jour mois jour-semaine)
#   Chaque samedi à 8h                      : 0 0 8 * * SAT
#   Le 22 de chaque mois à 8h               : 0 0 8 22 * *
#   Le 22, tous les 3 mois (janv, avr, ...) : 0 0 8 22 1/3 *
#   Chaque lundi et jeudi à 9h30            : 0 30 9 * * MON,THU
#   Chaque jour à 8h                        : 0 0 8 * * *
# ----------------------------------------------------------
relance.planification=0 58 13 * * *
relance.fuseau-horaire=Indian/Antananarivo

# ----------------------------------------------------------
# QUI MÉRITE UNE RELANCE ?
# ----------------------------------------------------------
# Nombre minimum de jours de retard après la date limite
relance.jours-retard-minimum=1
# Montant minimum restant dû (en Ariary) pour déclencher une relance
relance.montant-minimum=0
# Une même dette n'est pas relancée deux fois dans ce délai (anti-spam)
relance.delai-entre-deux-relances-jours=0
# Relancer aussi les dettes en échéancier dont la date limite est dépassée
relance.inclure-echeanciers=true

# ----------------------------------------------------------
# NIVEAU DE LA RELANCE (escalade)
#   1re relance -> 2e relance -> mise en demeure
# Nombre de relances déjà envoyées pour une dette avant de passer en mise en demeure
# ----------------------------------------------------------
relance.mise-en-demeure-apres=2

# ----------------------------------------------------------
# GROS VOLUMES
# Les contribuables en retard sont traités par lots de cette taille,
# chaque lot dans sa propre transaction (une erreur n'annule que son lot).
# ----------------------------------------------------------
relance.taille-lot=500

# ----------------------------------------------------------
# EMAIL
# Le compte d'envoi (MAIL_USERNAME / MAIL_PASSWORD) est dans le fichier .env,
# jamais ici : ce fichier peut être partagé, pas le mot de passe.
# ----------------------------------------------------------
# Les destinataires viennent de la base (contribuables.email), jamais de ce fichier.
# false = aucune relance par email (la notification dans l'espace est toujours créée)
relance.email.actif=true
# Lien affiché dans l'email vers l'espace contribuable
relance.email.lien-plateforme=http://localhost:3000/contribuable/notifications
# La relance met les emails en file d'attente (EN_ATTENTE) ; l'expéditeur les envoie ensuite par paquets.
# Toutes les N secondes, l'expéditeur envoie au plus "envois-par-passage" emails.
# Un compte Gmail personnel est limité à environ 500 emails par jour.
relance.email.envois-par-passage=20
relance.email.intervalle-expedition-secondes=30
