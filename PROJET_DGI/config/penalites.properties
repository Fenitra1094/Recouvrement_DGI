# ==========================================================
# HETRA-RINDRA - Calcul des pénalités de retard
# ----------------------------------------------------------
# Utilisé partout où une dette est calculée : tableau de bord
# contribuable, relances, emails.
# Après une modification : docker restart ssif-backend
# (pas besoin de recompiler ni de toucher à la base)
#
# Attention : pas de commentaire à la fin d'une ligne de valeur,
# un commentaire doit toujours être sur sa propre ligne.
# ==========================================================

# Taux de pénalité par mois de retard, appliqué au principal restant dû.
# 0.01 = 1 % par mois
penalite.taux-mensuel=0.01

# Comment compter les mois de retard (1 mois = 30 jours) :
#   true  : mois entamé, 1 jour de retard compte déjà pour 1 mois (31 jours = 2 mois)
#   false : mois complet, il faut 30 jours de retard pour compter 1 mois (31 jours = 1 mois)
penalite.mois-entames=true
